<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Graphify</title>
<style>
:root{--bg:#0f1218;--panel:#171c26;--line:#2a3142;--text:#e6e9ef;--mute:#8b94a7;--acc:#6ea8fe}
@media (prefers-color-scheme:light){:root{--bg:#f4f6fa;--panel:#fff;--line:#d9deea;--text:#1b2030;--mute:#6a7388;--acc:#2f6fed}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}
#app{display:grid;grid-template-columns:1fr 340px;height:100%}
#stage{position:relative;overflow:hidden}canvas{width:100%;height:100%;display:block;cursor:grab}
#bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
input,button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--acc)}
label{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--mute);cursor:pointer}
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#side h2{margin:0;padding:14px 16px 4px;font-size:16px;word-break:break-all}
#meta{padding:0 16px 8px;color:var(--mute);font-size:12px}
#nb{padding:0 16px 8px;display:flex;flex-wrap:wrap;gap:6px}
#nb a{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:2px 9px;cursor:pointer;color:var(--acc)}
#txt{flex:1;margin:0 16px;min-height:0;width:calc(100% - 32px);background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:12.5px ui-monospace,monospace;resize:none}
#act{padding:10px 16px;display:flex;gap:8px}
#legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--mute);max-width:60%}
#legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 4px 0 10px}#legend i:first-child{margin-left:0}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:1fr 45%}#side{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<div id="app">
 <div id="stage"><canvas id="c"></canvas>
  <div id="bar">
   <input id="q" placeholder="Szukaj…" autocomplete="off">
   <label><input type="checkbox" id="tags" checked style="padding:0"> tagi</label>
   <label><input type="checkbox" id="ghosts" checked style="padding:0"> brakujące</label>
   <button id="rescan">⟳ Skanuj</button><button id="fit">Dopasuj</button><button id="new">＋ Notatka</button>
  </div><div id="legend"></div></div>
 <aside id="side">
  <h2 id="title">Graphify</h2><div id="meta">Kliknij węzeł. Przeciągaj, przybliżaj kółkiem, przesuwaj tło.</div>
  <div id="nb"></div><textarea id="txt" spellcheck="false" hidden></textarea>
  <div id="act"><button id="save" hidden>Zapisz</button></div>
 </aside>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
let G={nodes:[],edges:[]},N=[],E=[],byId={},sel=null,hover=null,drag=null,pan=false;
let view={x:0,y:0,k:1},alpha=1,dpr=devicePixelRatio||1,query='';
const PAL=['#6ea8fe','#f6ad55','#68d391','#f687b3','#b794f4','#4fd1c5','#fc8181','#ecc94b','#90cdf4'];
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function colorOf(n){if(n.kind==='tag')return '#a0aec0';if(n.kind==='ghost')return '#718096';
 return PAL[groups.indexOf(n.group)%PAL.length]}
let groups=[];
async function api(p,o){const r=await fetch(p,o);return r.json()}
async function load(keep){
 G=await api('/api/graph');const lay=await api('/api/layout');
 const old=byId;groups=[...new Set(G.nodes.filter(n=>n.kind==='file').map(n=>n.group))].sort();
 N=G.nodes.map(n=>{const o=old[n.id],p=o||lay[n.id]||{x:(Math.random()-.5)*400,y:(Math.random()-.5)*400};
  return Object.assign(n,{x:p.x,y:p.y,vx:0,vy:0,r:5+Math.sqrt(n.degree)*2.5+(n.kind==='file'?2:0),fixed:false})});
 byId=Object.fromEntries(N.map(n=>[n.id,n]));
 E=G.edges.map(e=>({s:byId[e.source],t:byId[e.target],kind:e.kind}));
 $('legend').innerHTML=groups.map((g,i)=>`<i style="background:${PAL[i%PAL.length]}"></i>${g}`).join('')+'<i style="background:#a0aec0"></i>tag<i style="background:#718096"></i>brak pliku';
 alpha=Object.keys(lay).length?.15:1;if(!keep)setTimeout(fit,50);
}
function visible(n){return !(n.kind==='tag'&&!$('tags').checked)&&!(n.kind==='ghost'&&!$('ghosts').checked)}
function tick(){
 const vs=N.filter(visible);
 if(alpha>.005){
  for(let i=0;i<vs.length;i++)for(let j=i+1;j<vs.length;j++){
   const a=vs[i],b=vs[j];let dx=b.x-a.x,dy=b.y-a.y,d2=dx*dx+dy*dy+.01;if(d2>90000)continue;
   const f=1800/d2*alpha,d=Math.sqrt(d2);dx=dx/d*f;dy=dy/d*f;a.vx-=dx;a.vy-=dy;b.vx+=dx;b.vy+=dy}
  for(const e of E){if(!visible(e.s)||!visible(e.t))continue;
   const dx=e.t.x-e.s.x,dy=e.t.y-e.s.y,d=Math.hypot(dx,dy)||1,f=(d-70)*.02*alpha;
   e.s.vx+=dx/d*f;e.s.vy+=dy/d*f;e.t.vx-=dx/d*f;e.t.vy-=dy/d*f}
  for(const n of vs){n.vx-=n.x*.003*alpha;n.vy-=n.y*.003*alpha;
   if(!n.fixed){n.x+=n.vx;n.y+=n.vy}n.vx*=.6;n.vy*=.6}
  alpha*=.985;if(alpha<=.005)saveLayout();
 }
}
function neigh(n){const s=new Set([n]);for(const e of E){if(e.s===n)s.add(e.t);if(e.t===n)s.add(e.s)}return s}
function draw(){
 tick();const W=cv.width/dpr,H=cv.height/dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 ctx.translate(W/2+view.x,H/2+view.y);ctx.scale(view.k,view.k);
 const focus=sel||hover,nb=focus?neigh(focus):null,q=query.toLowerCase();
 const match=n=>!q||n.label.toLowerCase().includes(q)||n.id.toLowerCase().includes(q);
 for(const e of E){if(!visible(e.s)||!visible(e.t))continue;
  const on=focus&&(e.s===focus||e.t===focus);
  ctx.strokeStyle=on?css('--acc'):css('--line');ctx.globalAlpha=focus&&!on?.25:1;ctx.lineWidth=(on?1.8:1)/view.k;
  ctx.setLineDash(e.kind==='tag'?[3/view.k,3/view.k]:e.kind==='import'?[8/view.k,3/view.k]:[]);
  ctx.beginPath();ctx.moveTo(e.s.x,e.s.y);ctx.lineTo(e.t.x,e.t.y);ctx.stroke()}
 ctx.setLineDash([]);
 for(const n of N){if(!visible(n))continue;
  ctx.globalAlpha=(focus&&!nb.has(n))||!match(n)?.15:1;
  ctx.fillStyle=colorOf(n);ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fill();
  if(n===sel||(q&&match(n))){ctx.lineWidth=2/view.k;ctx.strokeStyle=css('--text');ctx.stroke()}
  if(view.k>.55||n===focus||(nb&&nb.has(n))||n.degree>3){ctx.fillStyle=css('--text');
   ctx.font=`${12/Math.max(view.k,.7)}px system-ui`;ctx.textAlign='center';ctx.fillText(n.label,n.x,n.y+n.r+13/Math.max(view.k,.7))}}
 ctx.globalAlpha=1;requestAnimationFrame(draw)
}
function resize(){const r=cv.getBoundingClientRect();cv.width=r.width*dpr;cv.height=r.height*dpr}
function toWorld(ev){const r=cv.getBoundingClientRect();return{x:(ev.clientX-r.left-r.width/2-view.x)/view.k,y:(ev.clientY-r.top-r.height/2-view.y)/view.k}}
function pick(ev){const p=toWorld(ev);let best=null,bd=1e9;
 for(const n of N){if(!visible(n))continue;const d=Math.hypot(n.x-p.x,n.y-p.y);if(d<n.r+4/view.k&&d<bd){best=n;bd=d}}return best}
function fit(){const vs=N.filter(visible);if(!vs.length)return;
 const xs=vs.map(n=>n.x),ys=vs.map(n=>n.y),r=cv.getBoundingClientRect();
 const w=Math.max(...xs)-Math.min(...xs)+120,h=Math.max(...ys)-Math.min(...ys)+120;
 view.k=Math.min(2,r.width/w,r.height/h);view.x=-(Math.max(...xs)+Math.min(...xs))/2*view.k;view.y=-(Math.max(...ys)+Math.min(...ys))/2*view.k}
let last=null;
cv.onmousedown=e=>{const n=pick(e);if(n){drag=n;n.fixed=true;alpha=Math.max(alpha,.3)}else{pan={x:e.clientX-view.x,y:e.clientY-view.y}}cv.style.cursor='grabbing';last=[e.clientX,e.clientY]};
addEventListener('mousemove',e=>{
 if(drag){const p=toWorld(e);drag.x=p.x;drag.y=p.y;alpha=Math.max(alpha,.2)}
 else if(pan){view.x=e.clientX-pan.x;view.y=e.clientY-pan.y}
 else if(e.target===cv){hover=pick(e);cv.style.cursor=hover?'pointer':'grab'}});
addEventListener('mouseup',e=>{const moved=last&&Math.hypot(e.clientX-last[0],e.clientY-last[1])>3;
 if(drag){drag.fixed=false;if(!moved)select(drag);else saveLayout()}else if(pan&&!moved)select(null);
 drag=null;pan=false;cv.style.cursor='grab'});
cv.onwheel=e=>{e.preventDefault();const k=Math.min(4,Math.max(.1,view.k*(e.deltaY<0?1.12:.89)));
 const r=cv.getBoundingClientRect(),mx=e.clientX-r.left-r.width/2,my=e.clientY-r.top-r.height/2;
 view.x=mx-(mx-view.x)*k/view.k;view.y=my-(my-view.y)*k/view.k;view.k=k};
let dirty=false;async function saveLayout(){
 await api('/api/layout',{method:'POST',body:JSON.stringify(Object.fromEntries(N.map(n=>[n.id,{x:Math.round(n.x),y:Math.round(n.y)}])))})}
async function select(n){
 sel=n;const nb=$('nb'),t=$('txt'),sv=$('save');nb.innerHTML='';
 if(!n){$('title').textContent='Graphify';$('meta').textContent='Kliknij węzeł.';t.hidden=sv.hidden=true;return}
 $('title').textContent=n.label;
 $('meta').textContent=n.kind==='file'?`${n.id} · ${n.words} słów · ${n.degree} powiązań`:n.kind==='tag'?`tag · użyty ${n.degree}×`:`brak pliku · wspomniany ${n.degree}×`;
 for(const m of neigh(n)){if(m===n)continue;const a=document.createElement('a');a.textContent=m.label;a.onclick=()=>{select(m);centerOn(m)};nb.append(a)}
 if(n.kind==='file'){const f=await api('/api/file?path='+encodeURIComponent(n.id));t.value=f.content;t.hidden=sv.hidden=false}
 else if(n.kind==='ghost'){t.hidden=true;sv.hidden=false;sv.textContent='Utwórz notatkę';return}
 else t.hidden=sv.hidden=true;
 sv.textContent='Zapisz'}
function centerOn(n){view.x=-n.x*view.k;view.y=-n.y*view.k}
$('save').onclick=async()=>{
 if(sel.kind==='ghost'){await api('/api/note',{method:'POST',body:JSON.stringify({title:sel.label})});await load(true);return}
 await api('/api/save',{method:'POST',body:JSON.stringify({path:sel.id,content:$('txt').value})});const id=sel.id;await load(true);select(byId[id]);alpha=.3};
$('new').onclick=async()=>{const t=prompt('Tytuł nowej notatki:');if(!t)return;
 const r=await api('/api/note',{method:'POST',body:JSON.stringify({title:t})});await load(true);if(r.path)select(byId[r.path])};
$('rescan').onclick=()=>{load(true);alpha=.5};$('fit').onclick=fit;
$('q').oninput=e=>query=e.target.value;$('tags').onchange=$('ghosts').onchange=()=>alpha=.4;
addEventListener('resize',resize);resize();load().then(()=>requestAnimationFrame(draw));
</script></body></html>
